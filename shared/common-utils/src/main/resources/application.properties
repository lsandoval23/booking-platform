# JWT Configuration
# Secret key for signing JWT tokens - MUST be changed in production
# Minimum 256 bits (32 characters) for HS256 algorithm
jwt.secret=your-secret-key-change-in-production-minimum-32-characters-required

# Access token expiration time in milliseconds (15 minutes = 900000 ms)
jwt.expiration.access=900000

# Refresh token expiration time in milliseconds (7 days = 604800000 ms)
jwt.expiration.refresh=604800000

# Logging Configuration
logging.level.com.booking.utils=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
