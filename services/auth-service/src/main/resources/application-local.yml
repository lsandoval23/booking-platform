# Auth Service Local Profile Configuration
# This profile is used when running the auth-service locally (not in Docker)
# Activate with: --spring.profiles.active=local

spring:
  # Database Configuration (Local PostgreSQL)
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: postgres

  # Redis Configuration (Local Redis)
  data:
    redis:
      host: localhost
      port: 6379
      password: ""

  # Flyway Configuration (same as base)
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

# JWT Configuration (Local - use secure values in production)
jwt:
  secret: local-dev-secret-key-change-this-in-production
  expiration: 3600000 # 1 hour
  refresh-expiration: 604800000 # 7 days

# Logging Configuration (More verbose for local development)
logging:
  level:
    root: INFO
    com.booking.auth: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: DEBUG
